<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Anatomy Quiz - Fixed</title>
    <style>
        :root { --red: #e74c3c; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        
        #ui-header { text-align: center; padding: 10px; }
        .label-bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 900px; padding: 15px; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        
        .draggable { padding: 8px 12px; background: white; border: 2px solid var(--red); color: var(--red); border-radius: 6px; cursor: grab; font-weight: bold; font-size: 13px; transition: 0.2s; user-select: none; }
        .draggable:active { transform: scale(0.95); }
        .selected { background: #ffeaa7 !important; border-color: #f1c40f !important; color: #000; }

        /* Game Board Area */
        #game-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 800 / 600; background-color: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* The Image itself */
        #heart-image { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }

        /* Patches to hide labels and act as drop zones */
        .patch { position: absolute; background: #fbe5e5; border: 2px dashed #ff9a9e; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer; color: transparent; z-index: 10; text-align: center; }
        .patch:hover { border-color: var(--red); color: #888; }
        .patch.correct { background: #55efc4 !important; border: 2px solid #00b894 !important; color: #006266 !important; font-size: 12px; }

        /* Coordinates (Approximate for image_a0b1bf.png) */
        .p1 { top: 16%; left: 10%; width: 25%; height: 8%; }  /* Brachiocephalic vein */
        .p2 { top: 31%; left: 10%; width: 20%; height: 6%; }  /* Right Atrium */
        .p3 { top: 53%; left: 18%; width: 20%; height: 6%; }  /* Left Atrium (pointing lower) */
        .p4 { top: 15%; left: 63%; width: 22%; height: 6%; }  /* Pulmonary Trunk */
        .p5 { top: 26%; left: 63%; width: 20%; height: 6%; }  /* Left Atrium */
        .p6 { top: 37%; left: 63%; width: 20%; height: 6%; }  /* Left Ventricle */
        .p7 { top: 45%; left: 63%; width: 22%; height: 6%; }  /* Top of the Heart */

        #msg { margin-top: 15px; font-weight: bold; font-size: 18px; min-height: 25px; }
    </style>
</head>
<body>

    <div id="ui-header">
        <h2 style="color: #c0392b;">Heart Labeling Master</h2>
        <p style="font-size: 14px; color: #666;">Step 1: Naam click karein | Step 2: Sahi box par click karein</p>
    </div>

    <div class="label-bank" id="bank">
        <div class="draggable" onclick="select(this, 'l1')">The right brachiocephalic vein</div>
        <div class="draggable" onclick="select(this, 'l2')">Right Atrium</div>
        <div class="draggable" onclick="select(this, 'l3')">Left Atrium</div>
        <div class="draggable" onclick="select(this, 'l4')">Pulmonary Truck</div>
        <div class="draggable" onclick="select(this, 'l5')">Left Atrium</div>
        <div class="draggable" onclick="select(this, 'l6')">Left Ventricle</div>
        <div class="draggable" onclick="select(this, 'l7')">Top of the Heart</div>
    </div>

    <div id="game-container">
        <!-- Direct reference to your image name -->
        <img id="heart-image" src="image_a0b1bf.png" alt="Heart Diagram">
        
        <!-- Interactive Patches -->
        <div class="patch p1" onclick="drop('l1', this)">DROP HERE</div>
        <div class="patch p2" onclick="drop('l2', this)">DROP HERE</div>
        <div class="patch p3" onclick="drop('l3', this)">DROP HERE</div>
        <div class="patch p4" onclick="drop('l4', this)">DROP HERE</div>
        <div class="patch p5" onclick="drop('l5', this)">DROP HERE</div>
        <div class="patch p6" onclick="drop('l6', this)">DROP HERE</div>
        <div class="patch p7" onclick="drop('l7', this)">DROP HERE</div>
    </div>

    <div id="msg"></div>

<script>
    let selectedLabelId = null;
    let selectedElement = null;

    function select(el, id) {
        // Reset previous selections
        document.querySelectorAll('.draggable').forEach(d => d.classList.remove('selected'));
        // Set new selection
        selectedLabelId = id;
        selectedElement = el;
        el.classList.add('selected');
        document.getElementById('msg').innerText = "Ab diagram ke sahi box par click karein";
        document.getElementById('msg').style.color = "orange";
    }

    function drop(targetId, patchElement) {
        if (!selectedLabelId) {
            document.getElementById('msg').innerText = "Pehle ek naam chunein!";
            document.getElementById('msg').style.color = "red";
            return;
        }

        if (selectedLabelId === targetId) {
            patchElement.classList.add('correct');
            patchElement.innerText = selectedElement.innerText;
            patchElement.onclick = null; // Disable after correct match
            selectedElement.style.visibility = "hidden";
            selectedLabelId = null;
            document.getElementById('msg').innerText = "Bilkul Sahi! 🎉";
            document.getElementById('msg').style.color = "#27ae60";
        } else {
            document.getElementById('msg').innerText = "Galat! Ye wo jagah nahi hai. ❌";
            document.getElementById('msg').style.color = "#e74c3c";
        }
    }
</script>

</body>
</html>
